name: Disaster Triaging UI Browser Smoke
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: disaster-ui-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install application dependencies
        run: npm ci
      - name: Install browser runner
        run: npm install --no-save playwright@1.55.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production frontend
        run: npm run build
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort >/tmp/triage-vite.log 2>&1 &
          echo $! >/tmp/triage-vite.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -I --fail http://127.0.0.1:4173/
      - name: Exercise synthetic API flows in Chromium
        run: node tests/ui.smoke.cjs
      - name: Save UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disaster-triaging-ui-evidence
          path: frontend/artifacts/
          if-no-files-found: ignore
      - name: Print preview logs on failure
        if: failure()
        run: cat /tmp/triage-vite.log || true
